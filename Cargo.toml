[package]
name = "diffy-ai-analysis"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Character-level provenance for AI-written code"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/computerchale/diffy-ai-analysis"
keywords = ["ai", "provenance", "git", "cursor", "attribution"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "diffy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.20"
ulid = { version = "3.0.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
